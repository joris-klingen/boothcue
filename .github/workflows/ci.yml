name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    # The plugin itself on Linux: JUCE builds the same code on macOS, which is
    # tested locally (in Live). Build, every test (the editor / display ones
    # under a virtual display with a window manager), pluginval.
    name: Plugin (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev zlib1g-dev xvfb openbox

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Tests and pluginval
        # One step: the virtual display has to outlive both.
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 openbox &
          sleep 2
          export DISPLAY=:99
          ctest --test-dir build --output-on-failure
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          ./pluginval --strictness-level 10 --validate-in-process build/BoothCue_artefacts/Release/VST3/BoothCue.vst3

  core:
    # The plain-C++ core and its checks only: quick feedback, no JUCE download.
    name: Core checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBOOTHCUE_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Cross-check against ALSmuse
        run: |
          pip install --quiet alsmuse
          python3 tools/alsmuse_crosscheck.py build/als-check tests/fixtures/parts.als
          python3 tools/alsmuse_crosscheck.py build/als-check tests/fixtures/fallback.als --track structure
