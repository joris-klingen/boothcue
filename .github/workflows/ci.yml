name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        # Makefiles: a bare --parallel means unlimited "make -j", which exhausts the runner's memory.
        run: cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            build/BoothCue_artefacts/Release/VST3/BoothCue.vst3

      - name: Package
        # ditto keeps the bundles' signatures inside the zip.
        run: |
          mkdir -p dist/BoothCue
          cp -R build/BoothCue_artefacts/Release/VST3/BoothCue.vst3 dist/BoothCue/
          cp -R build/BoothCue_artefacts/Release/Standalone/BoothCue.app dist/BoothCue/
          ditto -c -k --keepParent dist/BoothCue BoothCue-macOS.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: BoothCue-macOS
          path: BoothCue-macOS.zip

  core:
    # The plain-C++ core and its checks only: quick feedback, no JUCE download.
    name: Core checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBOOTHCUE_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Cross-check against ALSmuse
        run: |
          pip install --quiet alsmuse
          python3 tools/alsmuse_crosscheck.py build/als-check tests/fixtures/parts.als
          python3 tools/alsmuse_crosscheck.py build/als-check tests/fixtures/fallback.als --track structure
